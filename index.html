<style>
:root{--bg:#0d0b0c;--s2:#121011;--bd:#211e20;--bs:#2a2729;--tx:#f4f1f2;--td:#a8a2a5;--tf:#706a6d;--hb:#120d0f;--hbd:#241316;--ac:#8f2028;--ac2:#e5484d;--acd:#4a1015;--ar:229,72,77;--acm:rgba(var(--ar),.14);--pg:#060506;--sh:0 24px 54px rgba(0,0,0,.6);--r:7px;--f:'Sora',-apple-system,"Segoe UI",Roboto,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;padding:16px;display:flex;justify-content:center;align-items:center;color:var(--tx);font:13px/1.48 var(--f);background:radial-gradient(520px 380px at 8% -4%,rgba(var(--ar),.14),transparent 60%),radial-gradient(480px 380px at 100% 100%,rgba(124,92,255,.08),transparent 60%),var(--pg)}
.card{width:100%;max-width:440px;height:min(860px,calc(100dvh - 32px));display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:1px solid var(--bs);border-radius:16px;box-shadow:var(--sh);animation:pop .2s cubic-bezier(.2,.8,.25,1)}

@keyframes fade{from{opacity:0}}
.hd{display:flex;gap:12px;align-items:center;padding:16px 18px;background:var(--hb);border-bottom:1px solid var(--hbd)}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
.pv{display:flex;gap:10px;align-items:center;justify-content:center;flex:none}
.frame{width:92px;height:92px;border-radius:50%;overflow:hidden;border:2px solid var(--bs);box-shadow:0 0 0 4px var(--acm);touch-action:none;cursor:grab}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.fcard{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:.15s}

.dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.di{text-align:left;padding:9px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--td);font:600 12px var(--f);cursor:pointer;transition:.15s}
.di:hover{color:var(--tx);border-color:var(--bs)}.di.on{color:var(--tx);background:var(--acm);border-color:rgba(var(--ar),.4)}
